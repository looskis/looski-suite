<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome · Looski Suite</title><link rel="stylesheet" href="/setup.css"><script src="/setup.js" defer></script></head>
<body><main><p class="eyebrow">LOOSKI SUITE</p><h1>Make yourself at home.</h1><p>Create your owner account and name your workspace.</p>
<form><label>Your name<input name="display_name" autocomplete="name" maxlength="120" required></label><label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label><label>Workspace name<input name="workspace_name" autocomplete="organization" maxlength="120" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Repeat password<input name="confirm" type="password" autocomplete="new-password" required></label><p id="message" role="status"></p><button type="submit">Create my workspace →</button></form><noscript>Enable JavaScript to use this private setup link.</noscript><p class="help">This private link expires after one hour and closes when your account is created.</p></main></body></html>
